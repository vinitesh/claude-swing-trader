[project]
name = "swing-platform"
version = "0.1.0"
description = "Multi-strategy swing trading platform on Alpaca"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Broker & data
    "alpaca-py>=0.30.0",
    "yfinance>=0.2.40",
    "lxml>=5.0.0",          # required by yfinance.get_earnings_dates()
    # Data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta-classic>=0.5.0",
    # Config / env
    "pyyaml>=6.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Persistence
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pyarrow>=15.0.0",
    # CLI / logging
    "click>=8.1.7",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    # Notifications
    "httpx>=0.27.0",
    # Web UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
]

[project.scripts]
swingbot = "core.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "ipython>=8.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "strategies", "data", "execution", "risk", "notifications", "backtest", "persistence", "web"]
