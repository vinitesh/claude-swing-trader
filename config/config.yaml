# =====================================================================
# Global config — overrides via environment variables (see .env.example)
# =====================================================================

mode: paper        # paper | live | backtest

broker:
  type: alpaca
  data_feed: iex   # iex (free) | sip (paid SIP feed)

data:
  primary: yfinance       # yfinance | alpaca
  fallback: alpaca
  cache_dir: ./data_cache

risk:
  default_risk_pct: 0.01          # Risk 1% of account per trade
  max_open_positions: 8
  max_per_strategy: 5
  daily_loss_limit_pct: 0.03      # Halt trading if -3% in a day
  min_position_size_usd: 100      # Skip signals where position would be tiny

universe:
  # Full S&P 500 — resolved by core/config.py at load time. Strategies were
  # validated on this universe; deploying to a smaller subset would invalidate
  # the walk-forward sweep results.
  # To use a custom list instead, replace ["__SP500__"] with explicit symbols.
  default:
    - "__SP500__"

# Strategies to load. The registry auto-discovers them from strategies/.
# Each entry's `name` must match a Strategy.name attribute.
strategies:
  - name: pullback_ema
    enabled: true
    config_file: pullback_ema.yaml
  - name: rsi2
    enabled: true
    config_file: rsi2.yaml
  - name: donchian
    enabled: true                  # paper-trade only — failed walk-forward but
                                   # we want real-world data on the disconfirmation;
                                   # NEVER flip mode to live without re-validating
                                   # on Russell 3000 or longer test window
    config_file: donchian.yaml

notifications:
  telegram:
    enabled: true    # set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env

logging:
  level: INFO
  json: false
