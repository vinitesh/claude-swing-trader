# =====================================================================
# Donchian-N breakout — pure trend-following
#
# DISABLED in config.yaml — failed walk-forward validation:
#   median test Sharpe -0.21, 0/15 top-train clear gate, train→test drop -0.97.
#   Source: backtest_results/donchian/walk_forward_sweep.csv
#
# Why it failed: 2022-2023 test window was a structurally bad period for
# trend-followers (bear + choppy recovery). Strategy may work on:
#   - Wider universe (Russell 3000 instead of S&P 500)
#   - Longer test window (7+ years to dilute bad regimes)
#   - Multi-timeframe (55-day in addition to 20-day)
# Code kept for future reference; do not enable without re-validating.
#
# Buy when close > prior N-day max-of-closes AND close > 200-SMA.
# Exit via ATR-trailing stop (ratchets up). Hard stop as catastrophe floor.
# =====================================================================

allocation_pct: 0.20            # 20% of strategy cap per position (max ~5 positions)
risk_pct: 0.01                  # 1% account risk per trade (used for sizing only)
capital_allocation_usd: 33000   # Match the others; 3 strategies x $33k = $99k of ~$101.5k equity (~2.5% cash buffer)

# Indicator periods
donchian_period: 20             # rolling N-day high (20 = Turtles classic)
sma_long: 200                   # uptrend filter
# atr period is hardcoded to 14 in indicators (standard)

# Entry filters
min_atr_pct: 0.01               # ATR/close ≥ 1% — skip stagnant names
require_bull_regime: false      # Strategy has its own regime gate (close > 200-SMA)
avoid_earnings_within_days: 3   # Same hook as other strategies

# Exit rules
atr_mult: 2.0                   # trailing stop = highest_close - 2 × ATR(14)
hard_stop_pct: 0.08             # 8% catastrophe stop, never moves
take_profit_pct: 1.00           # 100% (effectively unused — exit on trail)
time_stop_days: 60              # Force exit after 60 days

# Universe override (uses global default if empty)
universe: []
