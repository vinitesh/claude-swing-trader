# =====================================================================
# Connors RSI(2) mean-reversion strategy
#
# Setup: Buy quality stocks (close > 200-SMA) when their 2-day RSI dips
#        oversold. Exit when RSI rebounds, with hard stop + time stop as
#        backstops.
# =====================================================================

#
# Locked params from walk-forward sweep (full S&P 500, 2019-2021 → 2022-2023):
#   oversold=5, exit=70, stop=0.03, time_stop=5, regime_off
#   train_sharpe=1.81  test_sharpe=1.42  test_cagr=11.7%  test_max_dd=-6.7%
# Sits in robust cluster (mean test Sharpe 1.34) of oversold=5, exit∈{70,75}, regime=off.
# Source: backtest_results/rsi2/walk_forward_sweep.csv
#
allocation_pct: 0.20            # Up to 20% of capital_allocation per position
risk_pct: 0.01                  # 1% account risk per trade
capital_allocation_usd: 25000   # Hard cap for multi-strategy paper account

# Indicator periods
rsi_short_period: 2
sma_long: 200

# Entry filters
oversold_threshold: 5           # sweep favored 5 (was default 10)
require_bull_regime: false      # SPY 200-SMA gate hurt mean test Sharpe in sweep

# Exit rules
exit_threshold: 70              # RSI(2) > 70 → exit at today's close
stop_loss_pct: 0.03             # 3% catastrophe stop (sweep favored 3% over 4%)
take_profit_pct: 0.20           # Wide TP (effectively unused — exit on RSI)
time_stop_days: 5               # Force exit after 5 days (sweep slight edge over 8)

# Universe override (uses global default if empty)
universe: []
