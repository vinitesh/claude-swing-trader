# =====================================================================
# docker-compose.yml — local & EC2-host orchestration for swing_platform
#
# Services (all share `x-job` template):
#   run-live      — daily scan + real order submission
#   run-live-dry  — same, but no broker submission (smoke / debug)
#   sync          — reconcile DB ↔ broker
#   report        — print per-strategy bake-off table
#   shell         — interactive bash for one-offs
#
# Volumes:
#   swing-state — holds trading.db (single source of truth for our app)
#   swing-logs  — application + cron logs (rotated by host logrotate on EC2)
#   swing-cache — yfinance parquet cache (rebuilds itself; safe to wipe)
#
# Bind mount:
#   ./config:/app/config:ro — strategy YAML lives outside the image so
#   parameter tweaks don't require a rebuild. Read-only inside container.
#
# Cron on EC2 invokes:
#     docker compose run --rm run-live
#     docker compose run --rm sync
# That keeps the runtime model identical between laptop and EC2.
#
# Use either `docker compose` or `podman compose` — same file.
# =====================================================================

x-job: &job
  build: .
  image: swing-platform:latest
  env_file: .env
  environment:
    DATABASE_URL: sqlite:////app/state/trading.db
  volumes:
    - swing-state:/app/state
    - swing-logs:/app/logs
    - swing-cache:/app/data_cache
    - ./config:/app/config:ro
  profiles: ["jobs"]

services:
  run-live:
    <<: *job
    command: ["run-live"]

  run-live-dry:
    <<: *job
    command: ["run-live", "--dry-run"]

  sync:
    <<: *job
    command: ["sync"]

  report:
    <<: *job
    command: ["report"]

  warm-earnings:
    <<: *job
    command: ["warm-earnings"]

  shell:
    <<: *job
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash"]
    stdin_open: true
    tty: true
    profiles: ["debug"]

  # Long-running web UI. Unlike the jobs above, this stays up and serves
  # HTTP. No `profiles` — it starts with plain `docker compose up -d web`.
  web:
    build: .
    image: swing-platform:latest
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/state/trading.db
    volumes:
      - swing-state:/app/state
      - swing-logs:/app/logs
      - swing-cache:/app/data_cache
      - ./config:/app/config:ro
    command: ["serve"]
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  swing-state:
  swing-logs:
  swing-cache:
